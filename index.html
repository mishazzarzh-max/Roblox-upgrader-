<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Доминус Апгрейдер</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Segoe UI,system-ui,sans-serif; color:#f5f7fb; background:#0c1018; }
  header { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:14px; border-bottom:1px solid #2c364b; }
  h1 { margin:0; font-size:20px; }
  .sub { color:#9aa6bd; font-size:12px; }
  .wallet { background:#161c28; border:1px solid #2c364b; border-radius:12px; padding:8px 12px; text-align:right; }
  .wallet b { color:#f5c451; font-size:20px; }
  button { font-family:inherit; font-weight:700; border:0; border-radius:10px; cursor:pointer; }
  .reset { background:transparent; color:#9aa6bd; border:1px solid #2c364b; padding:8px 10px; }
  main { max-width:720px; margin:0 auto; padding:14px; }
  .note { color:#9aa6bd; font-size:13px; background:#161c28; border:1px solid #2c364b; border-radius:12px; padding:10px; margin-bottom:12px; }
  section { background:#161c28; border:1px solid #2c364b; border-radius:16px; padding:12px; margin-bottom:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button { background:#1d2534; color:#9aa6bd; padding:8px 10px; }
  .tabs button.active { background:#243049; color:#fff; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .card { background:#1d2534; border:1px solid #2c364b; border-radius:12px; padding:8px; }
  .card.selected { outline:2px solid #f5c451; }
  .card img { width:100%; height:90px; object-fit:contain; background:#111; border-radius:8px; }
  .name { font-weight:700; font-size:14px; min-height:34px; }
  .meta { color:#9aa6bd; font-size:12px; }
  .price { color:#f5c451; font-weight:800; }
  .btn { background:#2563eb; color:#fff; padding:8px; width:100%; margin-top:6px; }
  .btn.gold { background:#b45309; }
  .btn:disabled { opacity:.45; }
  .wheel-box { position:relative; width:220px; height:220px; margin:12px auto; }
  #wheel { width:220px; height:220px; border-radius:50%; display:block; background:#111; }
  .pointer { position:absolute; left:98px; top:-2px; border-left:12px solid transparent; border-right:12px solid transparent; border-top:18px solid #fff; z-index:3; }
  #go { position:absolute; left:62px; top:62px; width:96px; height:96px; border-radius:50%; background:#b45309; color:#fff; border:4px solid #f5c451; z-index:2; font-size:16px; }
  .pick { background:#1d2534; border-radius:10px; padding:8px; margin-bottom:8px; display:flex; gap:8px; align-items:center; min-height:52px; }
  .pick img { width:42px; height:42px; object-fit:contain; background:#111; border-radius:8px; }
  .result { margin-top:8px; padding:10px; border-radius:10px; text-align:center; font-weight:800; background:#121722; }
  .result.win { background:#14532d; color:#bbf7d0; }
  .result.lose { background:#7f1d1d; color:#fecaca; }
  .log { max-height:120px; overflow:auto; font-size:13px; }
  .secret { position:absolute; width:22px; height:22px; border:0; background:transparent; font-size:16px; opacity:.35; z-index:5; padding:0; }
  .secret:hover { opacity:1; }
  .promo { display:flex; gap:6px; margin-top:8px; }
  .promo input { flex:1; border-radius:8px; border:1px solid #2c364b; background:#0c1018; color:#fff; padding:8px; }
  .win-text { color:#4ade80; } .lose-text { color:#f87171; }
</style>
</head>
<body>
<header>
  <div><h1>Доминус Апгрейдер</h1><div class="sub">Виртуальные монеты</div></div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="reset" id="reset">Сбросить</button>
    <div class="wallet"><div class="meta">Баланс</div><b id="balance">500</b><div class="meta" id="burgers">0 бургеров</div></div>
  </div>
</header>
<main>
  <div class="note">Старт 500 или 1000. Магазин до 100. Костю можно выбить с Волос бекона. С любой другой вещи шанс на Костю — 2%. Зелёное — выигрыш, красное — проигрыш.</div>
  <section>
    <div class="tabs">
      <button class="active" id="tab-shop">Магазин</button>
      <button id="tab-inv">Инвентарь</button>
      <button id="tab-prizes">Призы</button>
    </div>
    <div id="list" class="cards"></div>
  </section>
  <section>
    <h2 style="margin:0 0 8px;">Колесо</h2>
    <div class="pick" id="stake-box">Выбери вещь в инвентаре.</div>
    <div class="pick" id="target-box">Выбери приз.</div>
    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel" width="440" height="440"></canvas>
      <button type="button" id="go">Крутить</button>
      <button type="button" class="secret" id="burger-wheel" style="right:-6px;bottom:8px;" title=" ">🍔</button>
    </div>
    <div class="promo"><input id="code" placeholder="Промокод" /><button class="btn" id="code-go" style="width:auto;">Ок</button></div>
    <div class="result" id="result">Выбери ставку и приз.</div>
    <div class="log" id="log"></div>
  </section>
</main>

const ALL = [...SHOP, ...PRIZES];
const byId = Object.fromEntries(ALL.map(x => [x.id, x]));
function worth(n){ const s = String(n); if (/бургер/.test(s)) return 3n; if (/q$/i.test(s)) return BigInt(s.slice(0,-1)) * 1000000000000000n; return BigInt(s); }
function fmt(n){
  const s = String(n);
  if (/q$/i.test(s) || /бургер/.test(s)) return s;
  let v = BigInt(s);
  const suf = [["s",1000000000000000000000n],["Q",1000000000000000000n],["q",1000000000000000n],["t",1000000000000n],["b",1000000000n],["m",1000000n],["k",1000n]];
  for (const [name, base] of suf) if (v >= base) {
    const whole = v / base, frac = (v % base) / (base / 10n);
    return String(whole) + (frac ? "." + String(frac) : "") + name;
  }
  return v.toString();
}
function startCoins(){ return Math.random() < 0.5 ? 500 : 1000; }
let state = load();
let tab = "shop";
let spinning = false;
let rot = 0;
function load(){ try { const r = localStorage.getItem("upg-v10"); if (r) return JSON.parse(r); } catch(e){} return { balance:String(startCoins()), burgers:0, found:[], inv:[], stake:null, target:null, log:[] }; }
function save(){ localStorage.setItem("upg-v10", JSON.stringify(state)); }
function chance(stake, target){
  if (!stake || !target) return 0;
  if (target.id === "kocta") return stake.id === "bacon" ? 40 : 2;
  if (worth(target.price) <= worth(stake.price)) return 0;
  const step = ALL.findIndex(x => x.id === target.id) - ALL.findIndex(x => x.id === stake.id);
  if (step === 1) return 55;
  if (step === 2) return 35;
  return 15;
}
function draw(ch){
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const n = 12;
  const green = Math.max(ch ? 1 : 0, Math.round(n * ch / 100));
  ctx.clearRect(0,0,440,440);
  ctx.save();
  ctx.translate(220,220);
  ctx.rotate(rot);
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2 - Math.PI / 2;
    const a1 = (i + 1) / n * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,200,a0,a1);
    ctx.closePath();
    ctx.fillStyle = i < green ? (i % 2 ? "#16a34a" : "#4ade80") : (i % 2 ? "#b91c1c" : "#f87171");
    ctx.fill();
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.save();
    ctx.rotate((a0 + a1) / 2 + Math.PI / 2);
    ctx.fillStyle = "#111";
    ctx.font = "bold 18px Segoe UI";
    ctx.textAlign = "center";
    ctx.fillText(i < green ? "WIN" : "LOSE", 0, -130);
    ctx.restore();
  }
  ctx.restore();
}
function card(item, buttons, selected){
  const el = document.createElement("div");
  el.className = "card" + (selected || "");
  el.innerHTML = `<img alt="" src="${item.img}"><div class="name">${item.name}</div><div class="meta">${item.type}</div><div class="price">${fmt(item.price)}</div>${buttons}`;
  return el;
}
function render(){
  document.getElementById("balance").textContent = fmt(state.balance);
  const bw = document.getElementById("burger-wheel");
  if (bw) bw.style.display = (state.found || []).includes("wheel") ? "none" : "block";
  document.getElementById("burgers").textContent = (state.burgers || 0) + " бургеров";
  document.getElementById("tab-shop").classList.toggle("active", tab === "shop");
  document.getElementById("tab-inv").classList.toggle("active", tab === "inv");
  document.getElementById("tab-prizes").classList.toggle("active", tab === "prizes");
  const list = document.getElementById("list");
  list.innerHTML = "";
  const stakeItem = state.stake != null && state.inv[state.stake] ? byId[state.inv[state.stake].id] : null;
  const target = state.target ? byId[state.target] : null;
  if (tab === "shop") {
    SHOP.forEach(item => {
      const can = !spinning && (item.id === "chill" ? (state.burgers || 0) >= 3 : worth(state.balance) >= worth(item.price));
      list.appendChild(card(item, `<button class="btn" ${can?"":"disabled"} data-buy="${item.id}">Купить</button>`));
    });
  } else if (tab === "inv") {
    if (!state.found.includes("inv")) list.innerHTML = `<button type="button" class="secret" id="burger-inv" style="position:relative;opacity:.3;">🍔</button>`;
    if (!state.inv.length) list.innerHTML += `<div class="meta">Инвентарь пуст. Купи вещь в магазине.</div>`;
    state.inv.forEach((row, i) => {
      list.appendChild(card(byId[row.id], `<button class="btn gold" ${spinning?"disabled":""} data-stake="${i}">Поставить</button><button class="btn" ${spinning?"disabled":""} data-sell="${i}">Продать</button>`, state.stake === i ? " selected" : ""));
    });
  } else {
    PRIZES.forEach(item => {
      const can = !spinning && (item.id === "chill" ? (state.burgers || 0) >= 3 : worth(state.balance) >= worth(item.price));
      list.appendChild(card(item, `<button class="btn" ${spinning?"disabled":""} data-target="${item.id}">В колесо</button><button class="btn gold" ${can?"":"disabled"} data-buy="${item.id}">Купить</button>`, state.target === item.id ? " selected" : ""));
    });
  }
  document.getElementById("stake-box").innerHTML = stakeItem ? `<img alt="" src="${stakeItem.img}"><div>Ставка: <b>${stakeItem.name}</b><div class="meta">${fmt(stakeItem.price)}</div></div>` : "Выбери вещь в инвентаре.";
  document.getElementById("target-box").innerHTML = target ? `<img alt="" src="${target.img}"><div>Приз: <b>${target.name}</b><div class="meta">${target.id==="kocta" ? (stakeItem && stakeItem.id==="bacon" ? "с бекона 40%" : "с других вещей 2%") : fmt(target.price)}</div></div>` : "Выбери приз.";
  const ch = chance(stakeItem, target);
  if (!spinning) draw(ch);
  document.getElementById("go").textContent = ch ? ch + "%" : "Крутить";
  document.getElementById("log").innerHTML = state.log.slice(0,8).map(x => `<div class="${x.win?"win-text":"lose-text"}">${x.text}</div>`).join("");
  save();
}
function spin(){
  if (spinning) return;
  const stakeItem = state.stake != null && state.inv[state.stake] ? byId[state.inv[state.stake].id] : null;
  const target = state.target ? byId[state.target] : null;
  const ch = chance(stakeItem, target);
  if (!stakeItem || !target || !ch) {
    document.getElementById("result").textContent = "Поставь вещь и выбери приз.";
    return;
  }
  spinning = true;
  const index = state.stake;
  state.stake = null;
  state.inv.splice(index, 1);
  const win = Math.random() * 100 < ch;
  const n = 12;
  const green = Math.max(1, Math.round(n * ch / 100));
  const sector = win ? Math.floor(Math.random() * green) : green + Math.floor(Math.random() * (n - green));
  const mid = (sector + 0.5) / n * Math.PI * 2;
  const from = rot;
  const to = from + Math.PI * 2 * 5 + (Math.PI * 2 - mid);
  const t0 = Date.now();
  document.getElementById("result").className = "result";
  document.getElementById("result").textContent = "Колесо крутится...";
  const timer = setInterval(function(){
    const t = Math.min(1, (Date.now() - t0) / 2600);
    const e = 1 - Math.pow(1 - t, 3);
    rot = from + (to - from) * e;
    draw(ch);
    if (t >= 1) {
      clearInterval(timer);
      const box = document.getElementById("result");
      if (win) {
        state.inv.push({ id: target.id, uid: Date.now() });
        box.className = "result win";
        box.textContent = "Выигрыш: " + target.name;
        state.log.unshift({ win:true, text:"Зелёный: " + stakeItem.name + " → " + target.name });
      } else {
        box.className = "result lose";
        box.textContent = "Проигрыш. " + stakeItem.name + " сгорел.";
        state.log.unshift({ win:false, text:"Красный: " + stakeItem.name + " потерян" });
      }
      spinning = false;
      render();
    }
  }, 40);
}
document.getElementById("list").addEventListener("click", function(e){
  if (spinning) return;
  const buy = e.target.closest("[data-buy]");
  const stake = e.target.closest("[data-stake]");
  const sell = e.target.closest("[data-sell]");
  const target = e.target.closest("[data-target]");
  if (buy) {
    const item = byId[buy.dataset.buy];
    if (item.id === "chill") {
      if ((state.burgers || 0) >= 3) { state.burgers -= 3; state.inv.push({ id: item.id, uid: Date.now() }); }
    } else if (worth(state.balance) >= worth(item.price)) {
      state.balance = (worth(state.balance) - worth(item.price)).toString();
      state.inv.push({ id: item.id, uid: Date.now() });
    }
  }
  if (sell) {
    const i = Number(sell.dataset.sell);
    const row = state.inv[i];
    if (row) {
      state.balance = (worth(state.balance) + worth(byId[row.id].price)).toString();
      state.inv.splice(i, 1);
      if (state.stake === i) state.stake = null;
    }
  }
  if (stake) state.stake = Number(stake.dataset.stake);
  if (target) state.target = target.dataset.target;
  render();
});
document.getElementById("tab-shop").onclick = function(){ tab = "shop"; render(); };
document.getElementById("tab-inv").onclick = function(){ tab = "inv"; render(); };
document.getElementById("tab-prizes").onclick = function(){ tab = "prizes"; render(); };
function takeBurger(id){
  state.found = state.found || [];
  if (state.found.includes(id)) return;
  state.found.push(id);
  state.burgers = (state.burgers || 0) + 1;
  document.getElementById("result").className = "result win";
  document.getElementById("result").textContent = "Нашёл бургер! Сейчас " + state.burgers + " из 3.";
  render();
}
document.getElementById("burger-wheel").onclick = function(){ takeBurger("wheel"); this.remove(); };
document.getElementById("list").addEventListener("click", function(e){
  if (e.target.id === "burger-inv") takeBurger("inv");
});
document.getElementById("code-go").onclick = function(){
  const code = document.getElementById("code").value.trim().toLowerCase();
  if (code === "cookburger") takeBurger("code");
  else document.getElementById("result").textContent = "Промокод не подошёл.";
};
document.getElementById("go").onclick = spin;
document.getElementById("reset").onclick = function(){
  if (spinning) return;
  state = { balance:String(startCoins()), burgers:0, found:[], inv:[], stake:null, target:null, log:[] };
  document.getElementById("result").className = "result";
  document.getElementById("result").textContent = "Выбери ставку и приз.";
  render();
};
render();
</script>
